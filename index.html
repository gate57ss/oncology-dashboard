<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dr. Sai Oncology Dashboard - 肺癌薬物療法</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-red: #f43f5e;
      --accent-gold: #f59e0b;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 24px;
      line-height: 1.6;
    }

    header {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--text-sub);
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      width: 240px;
    }

    .search-box:focus {
      border-color: var(--accent-blue);
    }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--accent-blue);
      color: var(--bg-main);
      border-color: var(--accent-blue);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-blue);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .badge-latest {
      background: rgba(56, 189, 248, 0.2);
      color: var(--accent-blue);
      border: 1px solid var(--accent-blue);
    }

    .badge-history {
      background: rgba(245, 158, 11, 0.2);
      color: var(--accent-gold);
      border: 1px solid var(--accent-gold);
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--text-main);
    }

    .card-summary {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-bottom: 12px;
    }

    .predecessor-link {
      color: var(--accent-blue);
      text-decoration: underline;
      cursor: pointer;
      font-weight: bold;
      display: inline-block;
      margin-top: 4px;
    }

    .card-footer {
      font-size: 0.8rem;
      color: var(--text-sub);
      border-top: 1px solid var(--border-color);
      padding-top: 8px;
      margin-top: 8px;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      max-width: 800px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 32px;
      position: relative;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .close-btn:hover {
      color: var(--text-main);
    }

    .modal-section {
      margin-bottom: 24px;
    }

    .modal-section h3 {
      font-size: 1.1rem;
      color: var(--accent-blue);
      margin-bottom: 8px;
      border-left: 4px solid var(--accent-blue);
      padding-left: 8px;
    }

    .critical-appraisal-box {
      background: rgba(244, 63, 94, 0.1);
      border: 2px solid var(--accent-red);
      border-radius: 12px;
      padding: 16px;
      margin-top: 24px;
    }

    .critical-appraisal-box h3 {
      color: var(--accent-red);
      border-left: 4px solid var(--accent-red);
    }

    /* Sub Modal */
    .sub-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1100;
      padding: 20px;
    }

    .sub-modal-content {
      background: #0f172a;
      border: 2px solid var(--accent-gold);
      border-radius: 16px;
      max-width: 650px;
      width: 100%;
      max-height: 75vh;
      overflow-y: auto;
      padding: 24px;
      position: relative;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>🩺 Dr. Sai Oncology Dashboard</h1>
      <div class="subtitle">肺癌薬物療法・最新臨床試験 Critical Appraisal データベース (自動更新運用中)</div>
    </div>
    <div class="controls">
      <input type="text" id="searchInput" class="search-box" placeholder="試験名、薬剤、領域で検索..." oninput="filterTrials()">
      <button class="filter-btn active" onclick="setFilter('all')">全15個表示</button>
      <button class="filter-btn" onclick="setFilter('latest')">最先端・最新 (10)</button>
      <button class="filter-btn" onclick="setFilter('history')">歴史的・基本 (5)</button>
    </div>
  </header>

  <main class="grid" id="trialsGrid"></main>

      <div class="modal-section">

        <p id="modalDesign"></p>
      </div>

      <div class="modal-section">
        <h3>3. 詳細な結果と安全性データ (Endpoints & Results)</h3>
        <p id="modalResults"></p>
      </div>

      <div class="modal-section">
        <h3>4. 著者らの主張と議論 (Discussion)</h3>
        <p id="modalDiscussion"></p>
      </div>

      <div class="critical-appraisal-box">
        <h3>指導医 sai の深掘り Critical Appraisal</h3>
        <p id="modalAppraisal" style="margin-top: 8px; font-weight: 500;"></p>
      </div>
    </div>
  </div>

  <!-- サブモーダル (前身試験解説) -->

      <div id="subModalBody"></div>
    </div>
  </div>

    // 重複防止・更新関数 (upsert)
    function upsertTrial(newTrial) {
      const index = trialDatabase.findIndex(t => t.id === newTrial.id);
      if (index !== -1) {
        trialDatabase[index] = { ...trialDatabase[index], ...newTrial };
      } else {
        trialDatabase.push(newTrial);
      }
    }

    let currentFilter = 'all';

    // フィルタ・描画関数
    function renderGrid() {
      const grid = document.getElementById('trialsGrid');
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      grid.innerHTML = '';

      let filtered = trialDatabase.filter(trial => {
        const matchesFilter = currentFilter === 'all' || trial.type === currentFilter;
        const matchesSearch = trial.title.toLowerCase().includes(searchTerm) ||
                              trial.summary.toLowerCase().includes(searchTerm);
        return matchesFilter && matchesSearch;
      });

      filtered.forEach(trial => {
        const card = document.createElement('div');
        card.className = 'card';

        let predecessorHTML = '';
        if (trial.predecessorId && trial.predecessorName) {
          predecessorHTML = `<span class="predecessor-link" onclick="event.stopPropagation(); openSubModal('${trial.predecessorId}')">🔗 前身試験: ${trial.predecessorName}</span>`;
        }

        card.innerHTML = `
          <div>
            <div class="card-header">
              <span class="card-title">${trial.title}</span>
              <span class="badge ${trial.type === 'latest' ? 'badge-latest' : 'badge-history'}">
                ${trial.type === 'latest' ? '最先端' : '歴史的'}
              </span>
            </div>
            <div class="card-summary">${trial.summary}</div>
            ${predecessorHTML}
          </div>
          <div class="card-footer">クリックして詳細・saiのCritical Appraisalを表示</div>
        `;

        card.onclick = () => openDetailModal(trial);
        grid.appendChild(card);
      });
    }

    function setFilter(filterType) {
      currentFilter = filterType;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderGrid();
    }

    function filterTrials() {
      renderGrid();
    }

    // メインモーダル表示
    function openDetailModal(trial) {
      document.getElementById('modalTitle').innerText = trial.title;
      document.getElementById('modalBackground').innerText = trial.background;
      document.getElementById('modalDesign').innerText = trial.design;
      document.getElementById('modalResults').innerText = trial.results;
      document.getElementById('modalDiscussion').innerText = trial.discussion;
      document.getElementById('modalAppraisal').innerText = trial.appraisal;

      document.getElementById('detailModal').style.display = 'flex';
    }

    // サブモーダル表示 (前身試験)
    function openSubModal(predecessorId) {
      const predTrial = trialDatabase.find(t => t.id === predecessorId);
      if (!predTrial) return;

      document.getElementById('subModalTitle').innerText = `🔗 前身・基本試験: ${predTrial.title}`;
      document.getElementById('subModalBody').innerHTML = `
        <p style="margin-bottom: 12px;"><strong>【概要】</strong> ${predTrial.summary}</p>
        <p style="margin-bottom: 12px;"><strong>【試験デザイン】</strong> ${predTrial.design}</p>
        <p style="margin-bottom: 12px;"><strong>【主要結果】</strong> ${predTrial.results}</p>
        <div style="background: rgba(245, 158, 11, 0.1); border: 1px solid var(--accent-gold); padding: 12px; border-radius: 8px; margin-top: 12px;">
          <strong style="color: var(--accent-gold);">指導医 sai の視点:</strong><br>
          ${predTrial.appraisal}
        </div>
      `;

      document.getElementById('subModal').style.display = 'flex';
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }

    // 初期化描画
    renderGrid();
  </script>
</body>
</html>
