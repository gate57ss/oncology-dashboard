name: Daily Oncology Dashboard Auto Update

on:
  schedule:
    # 毎日 UTC 23:00 (日本時間 朝 8:00) に自動実行
    - cron: '0 23 * * *'
  workflow_dispatch: # 手動実行ボタンを有効化

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Dashboard Updater Script
        run: |
          python scripts/update_dashboard.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update oncology dashboard data [skip ci]" && git push)
